name: Site Health Tests

on:
  # Run AFTER the deploy, not alongside it.
  #
  # These tests assert against the live site. Triggered on push, they raced
  # the Build and Deploy workflow for the same commit: the post had been
  # committed but was not published yet, so the live-URL check 404'd and the
  # run failed on a site that was about to be correct. workflow_run fires
  # once the deploy has finished, so the live site always reflects the commit
  # being tested.
  workflow_run:
    workflows: ["Build and Deploy"]
    types: [completed]
  schedule:
    # Run daily at 07:00 UTC (8am Dublin/London summer time)
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  test-site:
    # Only test a commit that was actually deployed to the live site.
    #
    # workflow_run also fires for pull_request runs of Build and Deploy, and
    # the build job there is skipped — nothing is published, so the live site
    # would legitimately not contain the PR's posts and the checks would fail
    # against a site that was never supposed to change. Restrict to pushes.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Test the commit that was actually deployed, not whatever is on
          # main by the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history: the test orders posts by the commit that added
          # them, to identify the ones that were published most recently.
          # A shallow clone has no add-order to read.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run site tests
        run: python3 _tests/test_site.py

      - name: Run front matter validator
        run: python3 _tests/fix_front_matter.py --dry-run

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install gems
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --baseurl ""

      # Authoritative front matter gate. Ruby's YAML parser is the same one
      # Jekyll uses, so a parse failure here is a real parse failure there —
      # this is the check that was missing when five posts shipped malformed
      # front matter and published under garbage URLs.
      - name: Validate post front matter (Ruby YAML)
        run: ruby _tests/check_front_matter.rb

  # Notify on failure
  alert-on-failure:
    needs: [test-site]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify
        run: |
          echo "Site tests failed. Check the workflow run for details."
          # Create a GitHub issue comment on latest commit as alert
          echo "::error::Site health tests failed — see workflow logs"
