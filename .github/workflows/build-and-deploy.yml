name: Build and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# GitHub Pages allows exactly ONE deployment at a time. Two pushes landing
# seconds apart (the content pipeline publishes several posts in a morning
# window) produced two concurrent runs, and the second one died with:
#
#   "Deployment request failed ... due to in progress deployment.
#    Please cancel <sha> first or wait for it to complete."
#
# Serialise the deploys so each one waits for the previous to finish.
#
# cancel-in-progress is deliberately FALSE. Cancelling a run mid-deploy can
# leave a Pages deployment stuck "in progress", which blocks the very next
# deploy with the same error. With false, GitHub keeps at most one pending
# run per group: a burst of five pushes ends up as "run 1 deploying, run 5
# queued", and the queued run is always the newest commit — so no content is
# lost and no deploy is interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 _tests/fix_front_matter.py --dry-run
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      # Block the deploy if any post has malformed front matter. Jekyll does
      # not fail the build on a front matter parse error — it silently
      # publishes the post as a raw page under a wrong URL. This gate stops
      # that from reaching production again.
      - run: ruby _tests/check_front_matter.rb

  build:
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      # Needed to delete a stale "github-pages" artifact left behind by an
      # earlier attempt of this same run (see the cleanup step below).
      actions: write
    environment: github-pages
    # Only deploy to GitHub Pages on push to main, not on PRs
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - name: Write Gemfile
        run: |
          echo "source 'https://rubygems.org'" > Gemfile
          echo "gem 'minima'" >> Gemfile
          echo "gem 'jemoji'" >> Gemfile
          echo "gem 'kramdown-parser-gfm'" >> Gemfile
          echo "gem 'jekyll-seo-tag'" >> Gemfile
          echo "gem 'jekyll-feed'" >> Gemfile
          echo "gem 'jekyll-sitemap'" >> Gemfile
          echo "gem 'jekyll-redirect-from'" >> Gemfile
      - run: bundle install
      - run: bundle exec jekyll build --baseurl ""
      - name: Delete a stale Pages artifact from an earlier attempt
        # Re-running a failed run uploads a SECOND artifact named
        # "github-pages" into the same run, and deploy-pages@v4 then aborts:
        #   'Multiple artifacts named "github-pages" were unexpectedly found.
        #    Artifact count is 2.'
        # Removing the leftover first leaves exactly one artifact in the run.
        # Best-effort — if cleanup cannot run, the upload still proceeds.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id')
          for id in $ids; do
            echo "Deleting stale artifact $id"
            gh api -X DELETE "/repos/$REPO/actions/artifacts/$id" || true
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
